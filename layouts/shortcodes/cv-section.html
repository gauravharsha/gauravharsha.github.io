<section id="{{ .Get "id" }}" class="cv-section py-5" aria-labelledby="{{ .Get "id" }}-heading">
  <div class="container">
    <h3 id="{{ .Get "id" }}-heading" class="text-center">{{ .Get "title" }}</h3>
    <div class="row justify-content-center py-5">
      <div class="col-12 p-0">
        <div class="row align-items-center justify-content-center m-1 mb-4">
          <div class="col-md-9">
            <div class="card"><div class="card-body"><div class="py-1">
              {{ .Inner | markdownify }}
            </div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
